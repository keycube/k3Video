
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>keycube — Simulateur de frappe</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="app">

        <!-- Panneau de configuration -->
        <aside class="controls">

            <div class="brand">
                <span class="brand-icon">▣</span>
                <div>
                    <h1>keycube</h1>
                    <p>Simulateur de frappe</p>
                </div>
            </div>

            <div class="control-group">
                <label for="textInput">
                    Texte à afficher
                </label>

                <textarea
                    id="textInput"
                    rows="8"
                    spellcheck="false"
                    placeholder="Entrez votre texte..."
                >Hello world!</textarea>
            </div>

            <div class="control-group">
                <label for="speedInput">
                    Vitesse de frappe
                </label>

                <div class="speed-header">
                    <span>Intervalle par caractère</span>
                    <span id="speedValue">50 ms</span>
                </div>

                <input
                    type="range"
                    id="speedInput"
                    min="10"
                    max="300"
                    step="10"
                    value="50"
                >

                <div class="range-labels">
                    <span>Rapide</span>
                    <span>Lent</span>
                </div>
            </div>

            <div class="control-group">
                <label for="backgroundSelect">
                    Couleur du fond
                </label>

                <select id="backgroundSelect">
                    <option value="green">
                        Vert (Chroma Key)
                    </option>
                    <option value="blue">
                        Bleu (Chroma Key)
                    </option>
                </select>
            </div>

            <div class="control-group">
                <label>Commandes</label>

                <div class="button-group">
                    <button id="startBtn" class="primary">
                        Démarrer
                    </button>

                    <button id="resetBtn" class="secondary">
                        Réinitialiser
                    </button>
                </div>

                <button id="captureBtn" class="capture-btn">
                    Mode capture
                </button>
            </div>

            <div class="shortcuts">
                <h3>Raccourcis clavier</h3>

                <div>
                    <span>Démarrer / Pause</span>
                    <kbd>Espace</kbd>
                </div>

                <div>
                    <span>Réinitialiser</span>
                    <kbd>R</kbd>
                </div>

                <div>
                    <span>Quitter la capture</span>
                    <kbd>Échap</kbd>
                </div>
            </div>

        </aside>

        <!-- Zone de prévisualisation -->
        <main class="preview">

            <div class="preview-header">
                <div>
                    <h2>Prévisualisation</h2>
                    <p>Simulation de frappe keycube</p>
                </div>

                <span class="preview-badge">
                    LIVE PREVIEW
                </span>
            </div>

            <!-- Surface enregistrable -->
            <div class="capture-surface">

                <div class="typing-display">
                    <span id="terminalText"></span><span
                        id="cursor"
                        class="cursor"
                    >▋</span>
                </div>

            </div>

            <div class="preview-footer">
                <span>Capture compatible avec OBS</span>
                <span>1920 × 1080 recommandé</span>
            </div>

        </main>

    </div>

</body>
</html>
