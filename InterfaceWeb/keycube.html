<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>keycube</h1>

  <label for="input">Your text</label>
  <textarea id="input" placeholder="Type something here…"></textarea>
  <div class="hint">Press Ctrl/⌘ + Enter to type it out.</div>

  <div class="row">
    <button id="go">Type it</button>
    <button id="clear" class="secondary">Clear</button>
    <label class="check"><input type="checkbox" id="record"> Record video</label>
    <select id="size">
      <option value="1920x1080">1920 × 1080 (horizontal)</option>
      <option value="1080x1920">1080 × 1920 (vertical)</option>
    </select>
    <select id="bg">
      <option value="#00FF00">Green screen</option>
      <option value="#0000FF">Blue screen</option>
    </select>
    <label class="check">Text color <input type="color" id="color" value="#ffffff"></label>
    <div class="speed">
      <label for="speed" style="margin:0">Speed</label>
      <input type="range" id="speed" min="10" max="200" value="60">
    </div>
    <div class="speed">
      <label for="textsize" style="margin:0">Text size</label>
      <input type="range" id="textsize" min="40" max="200" value="80">
    </div>
  </div>

  <label>Output</label>
  <canvas id="output" width="1920" height="1080"></canvas>
  <div id="status" class="status"></div>

  <div id="result">
    <label>Recording</label>
    <video id="preview" controls playsinline></video>
    <a id="download" href="#">Download video</a>
    <div class="hint">If the download doesn't start here, open the .html file directly in your browser.</div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
